services:
  - type: web
    name: mppsc-iq-telegram-platform
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: mppsc-iq-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_USERNAME
        value: MPPSC_IQ_Quiz_Bot
      - key: DB_PATH
        value: /var/data/mppsc-iq.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: APP_BASE_URL
        sync: false
