name: MPPSC IQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check src/auth.js
          node --check src/db.js
          node --check src/server.js
          node --check src/question-bank-recovery.js
          node --check scripts/verify-backup.js
          node --check scripts/restore.js
          node --check scripts/setup-telegram.js
      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); if(!p.scripts.start || !p.dependencies.express || !p.dependencies.pg) process.exit(1); console.log('Package metadata OK')"
