<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body><p style="font:16px system-ui;padding:20px">MPPSC IQ Quiz लोड हो रहा है…</p>
<script>
(async()=>{
 try{
  const version='20261123-restore-quiz-loader-v19';
  const paths=['/revision-quiz-part1.txt','/revision-quiz-part2.txt','/revision-quiz-part3.txt','/revision-quiz.html','/data/revision-bank.json'].map(p=>p+'?v='+version);
  const parts=await Promise.all(paths.map(async p=>{const r=await fetch(p,{cache:'default',credentials:'same-origin'});if(!r.ok)throw Error('Quiz source unavailable: '+p+' ('+r.status+')');return r.text()}));
  const html=parts.join('');
  if(!html.includes('UNIT1_DATA')||!html.includes('toggleRevisionBookmark')||!html.includes('</body>'))throw Error('Quiz source validation failed');
  const bridge=\`<script>
  document.addEventListener('click',function(e){
   const b=e.target.closest('button');if(!b)return;
   const inline=b.getAttribute('onclick')||'';
   const m=inline.match(/toggleRevisionBookmark\\s*\\(\\s*(\\d+)\\s*,\\s*(\\d+)\\s*,\\s*this\\s*\\)/);
   if(!m)return;
   e.preventDefault();e.stopImmediatePropagation();
   if(typeof window.toggleRevisionBookmark!=='function'){alert('Bookmark function load नहीं हुआ।');return;}
   window.toggleRevisionBookmark(Number(m[1]),Number(m[2]),b);
  },true);
  <\/script>\`;  const finalHtml=html.replace('</body>',bridge+'</body>');
  if(finalHtml===html)throw Error('Quiz page insertion failed');
  document.open();document.write(finalHtml);document.close();
 }catch(e){console.error('MPPSC IQ revision quiz loader:',e);document.body.innerHTML='<p style="font:16px system-ui;padding:20px;color:#b00">Quiz लोड नहीं हुआ: '+String(e&&e.message||e)+'</p>';}
})();
</script></body></html>
