<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body><p style="font:16px system-ui;padding:20px">MPPSC IQ Quiz लोड हो रहा है…</p>
<script>
(async()=>{
 try{
  const response=await fetch('/pre2027-revision-quiz.html?v=20261123-source-recovery-v22',{cache:'no-store',credentials:'same-origin'});
  if(!response.ok)throw new Error('Quiz source HTTP '+response.status);
  const html=await response.text();
  const checks={size:html.length,unit:html.includes('UNIT1_DATA'),map:html.includes('UNIT_DATA_MAP'),bookmark:html.includes('toggleRevisionBookmark'),report:html.includes('reportRevisionQuestion'),body:html.includes('</body>')};
  if(!checks.unit||!checks.bookmark||!checks.body)throw new Error('Source incomplete: '+JSON.stringify(checks));
  const bridge=`<script>
  document.addEventListener('click',function(e){
   const b=e.target.closest('button');if(!b)return;
   const inline=b.getAttribute('onclick')||'';
   let m=inline.match(/toggleRevisionBookmark\\s*\\(\\s*(\\d+)\\s*,\\s*(\\d+)\\s*,\\s*this\\s*\\)/);
   if(m){
    e.preventDefault();e.stopImmediatePropagation();
    if(typeof window.toggleRevisionBookmark!=='function'){alert('Bookmark function load नहीं हुआ।');return;}
    window.toggleRevisionBookmark(Number(m[1]),Number(m[2]),b);return;
   }
   m=inline.match(/reportRevisionQuestion\\s*\\(\\s*(\\d+)\\s*,\\s*(\\d+)\\s*\\)/);
   if(m){
    e.preventDefault();e.stopImmediatePropagation();
    if(typeof window.reportRevisionQuestion!=='function'){alert('Report function load नहीं हुआ।');return;}
    window.reportRevisionQuestion(Number(m[1]),Number(m[2]));
   }
  },true);
  <\\/script>`;
  const finalHtml=html.replace('</body>',bridge+'</body>');
  document.open();document.write(finalHtml);document.close();
 }catch(e){console.error('MPPSC IQ revision quiz loader:',e);document.body.innerHTML='<p style="font:16px system-ui;padding:20px;color:#b00">Quiz लोड नहीं हुआ: '+String(e&&e.message||e)+'</p>';}
})();
</script></body></html>
