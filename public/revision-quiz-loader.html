<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><p style="font:16px system-ui;padding:20px">MPPSC IQ Quiz लोड हो रहा है…</p><script>(async()=>{try{const version='20261122-test-quiz-buttons-v8';const paths=['/revision-quiz-part1.txt','/revision-quiz-part2.txt','/revision-quiz-part3.txt','/revision-quiz.html','/data/revision-bank.json'].map(p=>p+'?v='+version);const parts=await Promise.all(paths.map(async p=>{const r=await fetch(p,{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error('Quiz source unavailable');return r.text()}));const html=parts.join('');if(!html.includes('UNIT1_DATA')||!html.includes('</body>'))throw Error('Quiz source validation failed');const reportStart=html.indexOf('function reportRevisionQuestion(i){');
const reportEnd=html.indexOf('\n\nfunction render()',reportStart);
if(reportStart<0||reportEnd<0)throw Error('Live report function not found');
const reportFix=String.raw`async function reportRevisionQuestion(i,button){
 const q=DATA[i];if(!q)return;
 if(button&&button.disabled)return;
 const unit=Number(q.__unit||activeUnit),qid=String(q.__qid||unit+':'+i),index=Number(qid.split(':').pop());
 const payload={unit,index,question:{q:q.q||'',en:q.en||'',options:q.options||[],answer:Number(q.answer)},reason:'प्रश्न में त्रुटि'};
 if(button){button.disabled=true;button.textContent='भेज रहे हैं…';}
 try{
  const r=await fetch('/api/revision-question-reports',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.error||'रिपोर्ट नहीं भेजी जा सकी');
  if(button){button.textContent='✓ रिपोर्ट हो गई';button.disabled=true;}
  else alert('रिपोर्ट भेज दी गई।');
 }catch(e){
  if(button){button.disabled=false;button.textContent='⚑ रिपोर्ट';}
  alert(e.message||'रिपोर्ट भेजने में समस्या हुई');
 }
}`;
html=html.slice(0,reportStart)+reportFix+html.slice(reportEnd);
html=html.replace('onclick="reportRevisionQuestion(\${idx})"','onclick="reportRevisionQuestion(\${idx},this)"');
if(!html.includes('onclick="reportRevisionQuestion(\${idx},this)"'))throw Error('Live report button not wired');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<p style="font:16px system-ui;padding:20px;color:#b00">Quiz लोड नहीं हुआ। कृपया Refresh करें।</p>'}})();</script></body></html>
