<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a32"><title>MPPSC IQ | Telegram Mini App</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--n:#101a32;--g:#e6b95f;--bg:#f3f5f9;--line:#e2e7ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:system-ui,"Noto Sans Devanagari",sans-serif}header{background:linear-gradient(135deg,#101a32,#263e68);color:white;padding:22px 18px 28px;border-radius:0 0 24px 24px}.brand{font-weight:900;font-size:20px}.brand span{color:var(--g)}header h1{font-size:22px;margin:22px 0 5px}header p{font-size:13px;color:#d7dfed;margin:0}.wrap{max-width:720px;margin:auto;padding:15px}.stats,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{grid-template-columns:repeat(3,1fr)}.card,.tile{background:white;border:1px solid var(--line);border-radius:15px;padding:14px}.stats b{font-size:19px;color:var(--n)}small{color:#788397}.stats small{display:block;font-size:11px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section h2{font-size:16px;margin:0}.tile{text-align:left;min-height:95px;color:inherit;cursor:pointer}.tile b{display:block;margin:7px 0 3px;font-size:13px}.tile span{font-size:22px}.btn{border:0;background:var(--n);color:white;border-radius:11px;padding:12px 15px;font-weight:750;width:100%;margin-top:10px}.soft{background:#edf1f7;color:var(--n)}.item{padding:13px;border-bottom:1px solid var(--line);background:white}.item button{margin-top:7px}.option{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:11px;padding:13px;margin:7px 0}.option.sel{border-color:var(--n);background:#eef2f9}.hidden{display:none}.muted{color:#748197;font-size:12px}footer{text-align:center;color:#8490a4;padding:22px;font-size:11px}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><div class="brand">MPPSC <span>IQ</span></div><h1>आपकी तैयारी, Telegram के अंदर</h1><p>यूनिट-वाइज टेस्ट • गलत प्रश्न • रिपोर्ट • PDF नोट्स</p></header><main class="wrap">
<section id="home"><div class="stats"><div class="card"><b id="testsN">—</b><small>उपलब्ध टेस्ट</small></div><div class="card"><b id="attemptN">—</b><small>दिए टेस्ट</small></div><div class="card"><b id="wrongN">—</b><small>गलत प्रश्न</small></div></div>
<div class="section"><h2>अभ्यास शुरू करें</h2><small>यूनिट चुनें</small></div><div class="grid" id="tests"></div>
<div class="section"><h2>मेरी तैयारी</h2></div><div class="grid"><button class="tile" onclick="loadWrong()"><span>❌</span><b>गलत प्रश्न</b><small>दोबारा अभ्यास करें</small></button><button class="tile" onclick="loadReports()"><span>📈</span><b>मेरी रिपोर्ट</b><small>टेस्ट प्रदर्शन देखें</small></button><button class="tile" onclick="loadResources()"><span>📚</span><b>PDF नोट्स</b><small>अध्ययन सामग्री</small></button></div><p class="muted" id="welcome"></p></section>
<section id="work" class="hidden"><div class="section"><button class="btn soft" style="width:auto;margin:0" onclick="home()">← वापस</button><small id="workTitle"></small></div><div id="workBody" class="card"></div></section></main><footer>MPPSC IQ · निरंतर अभ्यास और रिवीजन ही सफलता की कुंजी है</footer>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let token="",current=null,answers={},timer=null,seconds=0;
const $=id=>document.getElementById(id),api=async(path,opt={})=>{const r=await fetch("/api"+path,{...opt,headers:{...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})}});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;};
function alertMsg(m){tg?.showAlert?tg.showAlert(m):alert(m)}
async function boot(){if(!tg?.initData){$("welcome").textContent="यह ऐप Telegram के अंदर खोलें। विद्यार्थी लॉगिन Telegram से सुरक्षित रूप से होगा।";return;}try{const x=await api("/auth/telegram",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData})});token=x.token;$("welcome").textContent="नमस्ते, "+x.user.name+"! आपकी तैयारी शुरू करें।";await refresh();}catch(e){alertMsg(e.message)}}
async function refresh(){const [ts,at,w]=await Promise.all([api("/tests"),api("/attempts/mine"),api("/wrong-questions")]);$("testsN").textContent=ts.length;$("attemptN").textContent=at.length;$("wrongN").textContent=w.length;$("tests").innerHTML=ts.length?ts.map(t=>'<button class="tile" onclick="startTest('+t.id+')"><span>📝</span><b>'+esc(t.title)+'</b><small>'+esc(t.unit||"सामान्य अध्ययन")+' · '+t.question_count+' प्रश्न · '+t.duration_minutes+' मिनट</small></button>').join(""):'<div class="card muted">अभी कोई टेस्ट प्रकाशित नहीं है।</div>';}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function show(title,html){$("home").classList.add("hidden");$("work").classList.remove("hidden");$("workTitle").textContent=title;$("workBody").innerHTML=html;}
function home(){clearInterval(timer);$("work").classList.add("hidden");$("home").classList.remove("hidden");}
async function startTest(id){try{const d=await api("/tests/"+id+"/questions");current=d;answers={};seconds=d.test.duration_minutes*60;renderQuestion(0);clearInterval(timer);timer=setInterval(()=>{seconds--;const el=$("clock");if(el)el.textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");if(seconds<=0)submitTest()},1000);}catch(e){alertMsg(e.message)}}
function renderQuestion(i){const q=current.questions[i];show(current.test.title,'<div class="muted">प्रश्न '+(i+1)+' / '+current.questions.length+' <span style="float:right" id="clock"></span></div><h3>'+esc(q.question_hi)+'</h3>'+(q.question_en?'<p class="muted">'+esc(q.question_en)+'</p>':'')+q.options.map((o,j)=>'<button class="option '+(answers[q.id]===j?'sel':'')+'" onclick="pick('+q.id+','+j+','+i+')">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>').join("")+'<button class="btn" onclick="'+(i===current.questions.length-1?'submitTest()':'renderQuestion('+(i+1)+')')+'">'+(i===current.questions.length-1?'टेस्ट सबमिट करें':'अगला प्रश्न →')+'</button><button class="btn soft" onclick="'+(i?'renderQuestion('+(i-1)+')':'home()')+'">पिछला</button>');}
function pick(id,j,i){answers[id]=j;renderQuestion(i);}
async function submitTest(){if(!current)return;clearInterval(timer);try{const r=await api("/tests/"+current.test.id+"/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({answers})});current=null;show("टेस्ट परिणाम",'<h2>'+r.score+' / '+r.total+'</h2><h3>'+r.percentage+'% अंक</h3><p class="muted">आपका परिणाम सेव हो गया है। गलत उत्तर गलत प्रश्न अभ्यास में जुड़ गए हैं।</p><button class="btn" onclick="home();refresh()">होम पर जाएँ</button>');}catch(e){alertMsg(e.message)}}
async function loadWrong(){try{const a=await api("/wrong-questions");show("गलत प्रश्न",a.length?a.map(q=>'<div class="item"><b>'+esc(q.question_hi)+'</b><div>'+q.options.map((o,i)=>'<button class="option" onclick="resolveWrong('+q.wrong_id+','+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join("")+'</div></div>').join(""):'<p>अभी कोई गलत प्रश्न नहीं है।</p>');}catch(e){alertMsg(e.message)}}
async function resolveWrong(id,answer){try{const r=await api("/wrong-questions/"+id+"/resolve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({answer})});alertMsg(r.correct?"सही उत्तर! गलत प्रश्न सूची से हटाया गया।":"उत्तर गलत है, फिर प्रयास करें।");if(r.correct){loadWrong();refresh();}}catch(e){alertMsg(e.message)}}
async function loadReports(){try{const a=await api("/attempts/mine");show("मेरी रिपोर्ट",a.length?a.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><p>'+x.score+'/'+x.total+' अंक · '+esc(x.created_at)+'</p></div>').join(""):'<p>अभी कोई टेस्ट रिकॉर्ड नहीं है।</p>')}catch(e){alertMsg(e.message)}}
async function loadResources(){try{const a=await api("/resources");show("PDF नोट्स",a.length?a.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><p>'+esc(x.unit)+'</p><a href="/uploads/'+encodeURIComponent(x.file_path)+'" target="_blank">फाइल खोलें</a></div>').join(""):'<p>अभी कोई PDF अपलोड नहीं है।</p>')}catch(e){alertMsg(e.message)}}
boot();
</script></body></html>
