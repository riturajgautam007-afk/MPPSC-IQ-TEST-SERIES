<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b203d"><title>MPPSC IQ | Revision Tests</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#18243a;font-family:system-ui,'Noto Sans Devanagari',sans-serif}.head{padding:22px 16px;text-align:center;color:#fff;background:linear-gradient(130deg,#0b203d,#234b78);border-bottom:5px solid #e4bd55}.brand{font-size:27px;font-weight:900;color:#f5d675}.wrap{max-width:850px;margin:16px auto;padding:0 13px}.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;margin:5px 4px 5px 0;background:#173d70;color:white;font-weight:800;text-decoration:none}.gold{background:#e4bd55;color:#13233d}.card{background:white;border:1px solid #dbe3ef;border-radius:16px;padding:15px;margin:12px 0}.unit{font-weight:900;color:#173d70;font-size:18px}.test{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #e8edf4;padding:13px 0}.muted{color:#68778d;font-size:13px}.hidden{display:none!important}.q{font-size:18px;line-height:1.7;font-weight:750}.opt{display:block;padding:13px;border:1px solid #d4deeb;border-radius:11px;margin:9px 0;background:#f8fafd}.result{font-size:24px;font-weight:900;color:#173d70}#msg{color:#a12e2e;font-weight:700}@media(max-width:560px){.test{align-items:flex-start;flex-direction:column}.btn{min-height:44px}.q{font-size:17px}}
</style></head><body><header class="head"><div class="brand">✦ MPPSC IQ ✦</div><h3>REVISION TEST SERIES · UNIT WISE</h3></header><main class="wrap"><a class="btn gold" href="/">← मुख्य App</a><button class="btn" onclick="location.href='/api/auth/telegram/start'">Telegram Login</button><div id="msg"></div><section id="listing"><div class="card"><h2>Unit-wise Revision Tests</h2><p class="muted">आपके Admin Panel में प्रकाशित किए गए टेस्ट यहाँ अपने-आप संबंधित Unit में दिखाई देंगे।</p></div><div id="units">लोड हो रहा है…</div></section><section id="quiz" class="hidden"><div class="card"><h2 id="testTitle"></h2><div id="questions"></div><button class="btn gold" onclick="submitTest()">Submit Test</button><button class="btn" onclick="back()">टेस्ट सूची</button></div></section><section id="result" class="hidden"><div class="card"><h2>Test Result</h2><div id="score" class="result"></div><p id="resultMeta"></p><button class="btn" onclick="back()">वापस</button></div></section></main><script>
let current=null,answers={},isAdmin=false;const $=x=>document.getElementById(x);
async function api(url,opt={}){const r=await fetch('/api'+url,{...opt,credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'अनुरोध पूरा नहीं हुआ');return d}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function unitKey(v){let s=String(v||'').toLowerCase();let m=s.match(/(?:unit|यूनिट)\s*0*(\d+)/i)||s.match(/^\s*(\d+)\s*$/);return m?Math.min(10,Math.max(1,+m[1])):0}
async function load(){try{const me=await api('/me');isAdmin=me.role==='admin';if(isAdmin)$('msg').textContent='Admin Preview Mode: यहाँ सभी टेस्ट देख सकते हैं। टेस्ट Submit केवल Student Login से होगा।';const tests=await api('/tests');const groups={};tests.forEach(t=>{const n=unitKey(t.unit);if(n){(groups[n]??=[]).push(t)}});$('units').innerHTML=Object.keys(groups).length?Array.from({length:10},(_,i)=>i+1).filter(n=>groups[n]).map(n=>'<section class="card"><div class="unit">UNIT '+n+'</div>'+groups[n].map(t=>'<div class="test"><div><b>'+esc(t.title)+'</b><div class="muted">'+t.question_count+' प्रश्न · '+t.duration_minutes+' मिनट</div></div><button class="btn" onclick="start('+t.id+')">Start Test</button></div>').join('')+'</section>').join(''):'<div class="card">अभी कोई प्रकाशित Revision Test उपलब्ध नहीं है।</div>'}catch(e){$('msg').textContent='टेस्ट देखने के लिए Telegram से Login करें। '+e.message;$('units').innerHTML='<div class="card">ऊपर Telegram Login दबाकर लॉगिन करें।</div>'}}
async function start(id){try{current=await api('/tests/'+id+'/questions');answers={};$('testTitle').textContent=current.test.title+(isAdmin?' · ADMIN PREVIEW':'');$('questions').innerHTML=current.questions.map((q,i)=>'<div class="card"><div class="q">प्रश्न '+(i+1)+'. '+esc(q.question_hi)+'</div>'+(q.question_en?'<p class="muted">'+esc(q.question_en)+'</p>':'')+q.options.map((o,j)=>'<label class="opt"><input type="radio" name="q'+q.id+'" onchange="answers['+q.id+']='+j+'"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>').join('')+(isAdmin?'<p class="muted"><b>सही उत्तर:</b> '+String.fromCharCode(65+(q.correct_index||0))+' · '+esc(q.options[q.correct_index]||'')+'</p><p class="muted">'+esc(q.explanation||'')+'</p>':'')+'</div>').join('');$('listing').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('button.gold').style.display=isAdmin?'none':'inline-block';window.scrollTo(0,0)}catch(e){$('msg').textContent=e.message}}
async function submitTest(){if(!current||!confirm('क्या आप टेस्ट Submit करना चाहते हैं?'))return;try{const r=await api('/tests/'+current.test.id+'/submit',{method:'POST',body:JSON.stringify({answers})});$('score').textContent=r.score+' / '+r.total+' ('+r.percentage+'%)';$('resultMeta').textContent='आपका परिणाम सेव हो गया।';$('quiz').classList.add('hidden');$('result').classList.remove('hidden');window.scrollTo(0,0)}catch(e){$('msg').textContent=e.message}}
function back(){$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('listing').classList.remove('hidden');load();window.scrollTo(0,0)}load();
</script></body></html>
