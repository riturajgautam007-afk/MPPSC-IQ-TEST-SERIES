<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102744"><title>MPPSC IQ | Membership Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17263d;font-family:system-ui,"Noto Sans Devanagari",sans-serif}.top{background:linear-gradient(140deg,#102744,#24578a);color:#fff;padding:24px 17px;border-radius:0 0 22px 22px}.brand{font-size:24px;font-weight:950}.brand span{color:#e7bd62}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e4eaf2;border-radius:17px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f5f7fa;border-radius:12px;padding:13px}.stat b{font-size:23px;display:block}.muted,small{color:#718096;font-size:12px}.btn{border:0;border-radius:10px;padding:10px 12px;background:#102744;color:#fff;font-weight:800;cursor:pointer}.btn.green{background:#16845b}.btn.red{background:#bd4545}.item{padding:13px 0;border-top:1px solid #e4eaf2}.item:first-child{border:0}input{padding:10px;border:1px solid #dce3ed;border-radius:9px;width:100%}a{color:#fff}@media(max-width:550px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:9px}}</style></head><body><header class="top"><div class="brand">MPPSC <span>IQ</span> · MEMBERSHIP ADMIN</div><p>Paid Batch Access और Payment Verification</p><button class="btn" onclick="setupBot()">Telegram Bot Menu सेट करें</button> <span id="botStatus" class="muted"></span><a href="/admin.html">← मुख्य Admin Panel</a></header><main class="wrap"><section class="card"><h2>Membership Overview</h2><div class="grid" id="stats">लोड हो रहा है…</div></section><section class="card"><h2>Pending Payment Requests</h2><div id="requests">लोड हो रहा है…</div></section><section class="card"><h2>Student Memberships</h2><input id="search" placeholder="नाम / Telegram ID" oninput="renderStudents()"><div id="students">लोड हो रहा है…</div></section></main><script>
const $=id=>document.getElementById(id);let students=[];async function api(p,o={}){const r=await fetch('/api'+p,{credentials:'same-origin',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function setupBot(){try{const r=await api("/admin/telegram/setup",{method:"POST",body:"{}"});$("botStatus").textContent="Configured "+r.bot+" → "+r.url;alert("Telegram Menu Button सेट हो गया।")}catch(e){$("botStatus").textContent=e.message;alert(e.message)}}
async function refresh(){try{const me=await api('/me');if(me.role!=='admin')throw Error('Admin access आवश्यक');const [o,r,s]=await Promise.all([api('/admin/membership/overview'),api('/admin/membership/requests'),api('/admin/membership/students')]);$('stats').innerHTML=[['students','कुल विद्यार्थी'],['active','Active Paid'],['pending','Pending Requests']].map(([k,l])=>'<div class="stat"><b>'+o[k]+'</b><small>'+l+'</small></div>').join('');$('requests').innerHTML=r.length?r.map(x=>'<div class="item"><b>'+esc(x.name||'Student')+'</b> '+(x.username?'@'+esc(x.username):'')+'<p class="muted">Telegram ID: '+esc(x.telegram_id)+' · ₹'+x.amount_inr+' · UTR: <b>'+esc(x.utr)+'</b></p><p class="muted">'+esc(x.note||'')+' · '+new Date(x.created_at).toLocaleString('hi-IN')+'</p><button class="btn green" onclick="approve('+x.id+')">Approve · 365 days</button> <button class="btn red" onclick="reject('+x.id+')">Reject</button></div>').join(''):'<p class="muted">कोई Pending Request नहीं है।</p>';students=s;renderStudents()}catch(e){$('requests').textContent=e.message}}
function renderStudents(){const q=$('search').value.toLowerCase(),a=students.filter(x=>(x.name+' '+x.username+' '+x.telegram_id).toLowerCase().includes(q));$('students').innerHTML=a.map(x=>'<div class="item"><b>'+esc(x.name||'Student')+'</b><p class="muted">'+(x.username?'@'+esc(x.username)+' · ':'')+'Telegram ID: '+esc(x.telegram_id)+'</p><p><b>Status:</b> '+esc(x.status||'inactive')+' · '+esc(x.batch||'No batch')+' '+(x.ends_at?'· Valid till '+new Date(x.ends_at).toLocaleDateString('hi-IN'):'')+'</p><button class="btn green" onclick="activate('+x.id+')">Activate 365 days</button> '+(x.status==='active'?'<button class="btn red" onclick="revoke('+x.id+')">Revoke</button>':'')+'</div>').join('')||'<p class="muted">कोई विद्यार्थी नहीं मिला।</p>'}
async function approve(id){if(!confirm('भुगतान अनुरोध approve करके 365 दिनों का Paid Access देना है?'))return;try{await api('/admin/membership/requests/'+id+'/approve',{method:'POST',body:JSON.stringify({days:365})});alert('Membership Active कर दी गई।');refresh()}catch(e){alert(e.message)}}
async function reject(id){if(!confirm('इस भुगतान अनुरोध को Reject करें?'))return;try{await api('/admin/membership/requests/'+id+'/reject',{method:'POST',body:'{}'});refresh()}catch(e){alert(e.message)}}
async function activate(id){const days=Number(prompt('कितने दिनों का Paid Access देना है?','365'));if(!days)return;try{await api('/admin/membership/students/'+id+'/activate',{method:'POST',body:JSON.stringify({days})});alert('Membership Active.');refresh()}catch(e){alert(e.message)}}
async function revoke(id){if(!confirm('इस विद्यार्थी का Paid Access बंद करना है?'))return;try{await api('/admin/membership/students/'+id+'/revoke',{method:'POST',body:'{}'});refresh()}catch(e){alert(e.message)}}refresh();
</script></body></html>
