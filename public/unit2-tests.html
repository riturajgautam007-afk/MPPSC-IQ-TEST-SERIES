<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b203d"><title>MPPSC IQ | Unit 2 Tests</title><style>
:root{--n:#0b203d;--b:#173d70;--g:#e4bd55}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243b;font-family:Arial,'Noto Sans Devanagari',sans-serif}.head{background:linear-gradient(120deg,#0b203d,#23466e);color:#fff;padding:22px 16px;border-bottom:5px solid var(--g);text-align:center}.brand{font-size:27px;font-weight:900;color:#f5d675}.wrap{max-width:760px;margin:18px auto;padding:0 14px}.card{background:white;border:1px solid #d6dfeb;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 5px 16px #12213b0c}.btn{border:0;border-radius:12px;background:var(--b);color:white;padding:12px 16px;font-weight:700;font-size:15px;margin:4px 4px 4px 0}.gold{background:var(--g);color:#14243c}.muted{color:#68778d}.test{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{font-size:12px;background:#e9f0fa;color:#173d70;padding:5px 9px;border-radius:20px}.q{font-size:18px;font-weight:700;line-height:1.7}.opt{display:block;padding:13px;border:1px solid #d4deeb;border-radius:11px;margin:9px 0;background:#f8fafd}.result{font-size:22px;font-weight:800;color:#173d70}.hidden{display:none!important}#msg{color:#9c2c2c;font-weight:700;margin:10px 0}@media(max-width:520px){.test{align-items:flex-start;flex-direction:column}.btn{min-height:44px}.q{font-size:17px}}
</style></head><body><header class="head"><div class="brand">✦ MPPSC IQ ✦</div><h3>UNIT 2 · MP HISTORY & CULTURE · TEST SERIES</h3></header><main class="wrap"><button class="btn gold" onclick="location.href='/'">← मुख्य App</button><button class="btn" onclick="location.href='/api/auth/telegram/start'">Telegram से Login</button><div id="msg"></div><section id="list"><div class="card"><h2>Unit 2 के प्रकाशित टेस्ट</h2><p class="muted">टेस्ट चुनें और Start Test दबाएँ।</p></div><div id="tests">टेस्ट लोड हो रहे हैं…</div></section><section id="quiz" class="hidden"><div class="card"><h2 id="title"></h2><span id="count" class="pill"></span><div id="questions"></div><button class="btn gold" onclick="submitTest()">टेस्ट Submit करें</button><button class="btn" onclick="back()">टेस्ट सूची</button></div></section><section id="result" class="hidden"><div class="card"><h2>आपका परिणाम</h2><div id="score" class="result"></div><p id="meta"></p><button class="btn" onclick="back()">वापस टेस्ट सूची</button></div></section></main><script>
let current=null,answers={};const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch('/api'+url,{...opt,credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Login या अनुरोध में समस्या हुई');return d}
function msg(t){$('msg').textContent=t||''}function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function unit2(v){return /unit\s*0?2|यूनिट\s*0?2|(^|\D)2(\D|$)/i.test(String(v||''))}
async function load(){try{const me=await api('/me');if(me.role==='admin'){msg('Admin login है। टेस्ट हल करने के लिए विद्यार्थी के Telegram account से Login करें।');return}const ts=await api('/tests');const list=ts.filter(t=>unit2(t.unit));$('tests').innerHTML=list.length?list.map(t=>'<div class="card test"><div><h3>'+esc(t.title)+'</h3><span class="pill">'+t.question_count+' प्रश्न · '+t.duration_minutes+' मिनट</span></div><button class="btn" onclick="start('+t.id+')">Start Test</button></div>').join(''):'<div class="card">Unit 2 के लिए कोई प्रकाशित टेस्ट नहीं मिला। Admin Panel में Unit / विषय में “Unit 2” लिखें और “टेस्ट तुरंत प्रकाशित करें” चुनें।</div>'}catch(e){msg('पहले Telegram से Login करें। '+e.message);$('tests').innerHTML='<div class="card">टेस्ट देखने के लिए Telegram Login आवश्यक है।</div>'}}
async function start(id){try{current=await api('/tests/'+id+'/questions');answers={};$('title').textContent=current.test.title;$('count').textContent=current.questions.length+' प्रश्न';$('questions').innerHTML=current.questions.map((q,i)=>'<div class="card"><div class="q">प्रश्न '+(i+1)+'. '+esc(q.question_hi)+'</div>'+(q.question_en?'<p class="muted">'+esc(q.question_en)+'</p>':'')+q.options.map((o,j)=>'<label class="opt"><input type="radio" name="q'+q.id+'" value="'+j+'" onchange="answers['+q.id+']='+j+'"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>').join('')+'</div>').join('');$('list').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');window.scrollTo(0,0)}catch(e){msg(e.message)}}
async function submitTest(){if(!current||!confirm('क्या आप टेस्ट Submit करना चाहते हैं?'))return;try{const r=await api('/tests/'+current.test.id+'/submit',{method:'POST',body:JSON.stringify({answers})});$('score').textContent=r.score+' / '+r.total+' ('+r.percentage+'%)';$('meta').textContent='आपका टेस्ट सफलतापूर्वक सेव हो गया।';$('quiz').classList.add('hidden');$('result').classList.remove('hidden');window.scrollTo(0,0)}catch(e){msg(e.message)}}
function back(){$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('list').classList.remove('hidden');load();window.scrollTo(0,0)}load();
</script></body></html>
